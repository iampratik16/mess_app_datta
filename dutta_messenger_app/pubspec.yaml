name: dutta_messenger_app
description: "DuttaMessenger — Private institutional messaging platform"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  uuid: ^4.3.3
  json_annotation: ^4.8.1
  google_fonts: ^6.1.0
  web_socket_channel: ^2.4.0
  flutter_dotenv: ^5.1.0
  image_picker: ^1.0.7
  file_picker: ^8.0.0
  mime: ^1.0.5
  url_launcher: ^6.2.5
  flutter_linkify: ^6.0.0
  linkify: ^5.0.0
  # FCM push tokens — POST /notifications/tokens. Init is wrapped in
  # try/catch so the app keeps working when GoogleService-Info.plist /
  # google-services.json have not been provisioned yet.
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.7.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/
